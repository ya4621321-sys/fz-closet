<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRUITS ZIPPER COLLECTION | Goods Closet ♡</title>
<style>
  :root { --bg: #fff8fb; --text: #3a2e39; --sub: #8c7a89; --pink: #ff6b9d; --border: #f3d9e5; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
  .rainbow-bar { height: 6px; background: linear-gradient(90deg, #ff3b3b, #ff8c00, #ffd700, #32cd32, #00bfff, #9370db, #ff69b4); }
  header { background: #fff; padding: 18px 16px 14px; text-align: center; border-bottom: 2px dashed var(--border); }
  .brand-sub { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--pink); }
  h1 { font-size: 20px; font-weight: 900; margin: 4px 0; }
  .tagline { font-size: 12px; color: var(--sub); font-weight: 600; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
  .stat-box { background: #fff; border-radius: 14px; padding: 10px 6px; text-align: center; border: 2px solid var(--border); }
  .stat-num { font-size: 20px; font-weight: 900; color: var(--pink); }
  .stat-label { font-size: 10px; font-weight: 700; color: var(--sub); margin-top: 2px; }
  .main-tabs { display: flex; gap: 6px; padding: 0 14px 10px; }
  .tab-btn { flex: 1; padding: 10px 4px; border-radius: 12px; background: #fff; color: var(--sub); font-size: 12px; font-weight: 800; border: 2px solid var(--border); cursor: pointer; }
  .tab-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); }
  .tab-btn.add-btn { background: #ffebf2; color: var(--pink); border-color: var(--pink); }
  .filter-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 10px; }
  .chip { white-space: nowrap; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; background: #fff; border: 1.5px solid var(--border); color: var(--sub); cursor: pointer; }
  .chip.active { background: #3a2e39; color: #fff; }
  .container { padding: 0 14px; }
  .goods-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .goods-card { background: #fff; border-radius: 16px; overflow: hidden; border: 2.5px solid var(--m-color, var(--border)); display: flex; flex-direction: column; }
  .card-img-wrap { width: 100%; aspect-ratio: 1 / 1; background: #fdf2f7; display: flex; align-items: center; justify-content: center; position: relative; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .status-badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px; color: #fff; }
  .st-owned { background: #32cd32; } .st-unowned { background: #999; } .st-trade { background: #ff6b9d; }
  .qty-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.65); color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 8px; }
  .card-body { padding: 8px 10px; flex: 1; display: flex; flex-direction: column; }
  .tag-member { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #fff; background: var(--m-color); }
  .tag-cat { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #f4eef2; }
  .card-title { font-size: 12px; font-weight: 800; margin: 4px 0; flex: 1; }
  .card-memo { font-size: 10px; color: var(--sub); margin-bottom: 6px; }
  .card-actions { display: flex; gap: 4px; border-top: 1px solid #f5ebf0; padding-top: 6px; }
  .btn-mini { flex: 1; border: none; background: #f8f0f4; font-size: 10px; font-weight: 800; padding: 6px 0; border-radius: 8px; cursor: pointer; }
  .form-card { background: #fff; border-radius: 18px; padding: 16px; border: 2px solid var(--pink); }
  .form-group { margin-bottom: 12px; }
  .form-label { display: block; font-size: 11px; font-weight: 800; color: var(--sub); margin-bottom: 4px; }
  .form-input, .form-select { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 12px; font-size: 14px; background: #fff; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-primary { width: 100%; background: var(--pink); color: #fff; border: none; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; }
  .btn-img-gen { width: 100%; background: linear-gradient(90deg, #ff6b9d, #9b5de5); color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; }
  .member-section { background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 12px; border-left: 6px solid var(--m-color); }
  .trade-box { background: #fff; border-radius: 16px; padding: 14px; border: 2px solid var(--pink); margin-bottom: 14px; }
  .img-result-wrap { text-align: center; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--border); }
  .img-result-wrap img { width: 100%; border-radius: 12px; border: 2px solid var(--pink); margin-top: 8px; }
  .footer-box { margin: 24px 14px 0; background: #fff; border-radius: 16px; padding: 16px; border: 1.5px solid var(--border); font-size: 11px; color: var(--sub); line-height: 1.6; }
  .backup-btns { display: flex; gap: 8px; margin: 12px 0; }
  .btn-backup { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--pink); background: #fff; color: var(--pink); font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; }
</style>
</head>
<body>
<div class="rainbow-bar"></div>
<header>
  <div class="brand-sub">FRUITS ZIPPER COLLECTION</div>
  <h1>Goods Closet ♡</h1>
  <div class="tagline">わたしだけの推し活グッズ図鑑 🎀</div>
</header>
<div class="stats-grid">
  <div class="stat-box"><div class="stat-num" id="stat-types">0</div><div class="stat-label">登録グッズ</div></div>
  <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-label">所持数</div></div>
  <div class="stat-box"><div class="stat-num" id="stat-trade">0</div><div class="stat-label">交換に出せる</div></div>
</div>
<div class="main-tabs">
  <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">グッズ一覧</button>
  <button class="tab-btn add-btn" id="tab-add" onclick="openAddForm()">＋ 登録</button>
  <button class="tab-btn" id="tab-member" onclick="switchTab('member')">メンバー別</button>
  <button class="tab-btn" id="tab-trade" onclick="switchTab('trade')">交換リスト</button>
</div>
<div id="filter-area">
  <div class="filter-bar">
    <button class="chip active" onclick="setStatusFilter('all', this)">すべて</button>
    <button class="chip" onclick="setStatusFilter('owned', this)">所持</button>
    <button class="chip" onclick="setStatusFilter('unowned', this)">未所持</button>
    <button class="chip" onclick="setStatusFilter('trade', this)">交換可</button>
  </div>
  <div class="filter-bar">
    <button class="chip active" onclick="setCatFilter('all', this)">全種別</button>
    <button class="chip" onclick="setCatFilter('生写真', this)">生写真</button>
    <button class="chip" onclick="setCatFilter('アクスタ', this)">アクスタ</button>
    <button class="chip" onclick="setCatFilter('缶バッジ', this)">缶バッジ</button>
    <button class="chip" onclick="setCatFilter('トレカ', this)">トレカ</button>
    <button class="chip" onclick="setCatFilter('その他', this)">その他</button>
  </div>
</div>
<div class="container">
  <div id="view-all">
    <div style="font-size:13px;font-weight:800;margin:6px 0 10px;">コレクション <span id="list-count">0</span>件</div>
    <div class="goods-grid" id="goods-grid"></div>
  </div>
  <div id="view-add" style="display:none;">
    <div class="form-card">
      <div style="font-size:15px;font-weight:900;text-align:center;margin-bottom:12px;color:var(--pink);" id="form-heading">🎀 グッズを登録する</div>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label class="form-label">グッズ名（必須）</label><input type="text" id="f-name" class="form-input" placeholder="例：生写真 衣装A"></div>
      <div class="row-2">
        <div class="form-group"><label class="form-label">メンバー</label><select id="f-member" class="form-select"><option value="月足天音">❤️ 月足天音</option><option value="鎮西寿々歌">🧡 鎮西寿々歌</option><option value="櫻井優衣">💚 櫻井優衣</option><option value="仲川瑠夏">💜 仲川瑠夏</option><option value="真中まな">🩵 真中まな</option><option value="松本かれん">🩷 松本かれん</option><option value="早瀬ノエル">💛 早瀬ノエル</option><option value="全員・集合">🌈 全員・集合</option></select></div>
        <div class="form-group"><label class="form-label">種別</label><select id="f-cat" class="form-select"><option>生写真</option><option>アクスタ</option><option>缶バッジ</option><option>トレカ</option><option>その他</option></select></div>
      </div>
      <div class="row-2">
        <div class="form-group"><label class="form-label">ステータス</label><select id="f-status" class="form-select"><option value="owned">所持</option><option value="trade">交換可</option><option value="unowned">未所持</option></select></div>
        <div class="form-group"><label class="form-label">所持数</label><input type="number" id="f-qty" class="form-input" value="1" min="0"></div>
      </div>
      <div class="form-group"><label class="form-label">写真</label><input type="file" id="f-img" accept="image/*" class="form-input" onchange="handleImage(event)"></div>
      <div class="form-group"><label class="form-label">メモ</label><input type="text" id="f-memo" class="form-input" placeholder="例：ヨリ、サイン入り"></div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="tab-btn" onclick="switchTab('all')">戻る</button>
        <button class="btn-primary" style="flex:2;" onclick="saveItem()">保存する ♡</button>
      </div>
    </div>
  </div>
  <div id="view-member" style="display:none;"></div>
  <div id="view-trade" style="display:none;">
    <div class="trade-box">
      <div style="font-size:13px; font-weight:900; color:var(--pink); margin-bottom:8px;">🖼️ 交換一覧画像メーカー（「譲」「求」スタンプ付き）</div>
