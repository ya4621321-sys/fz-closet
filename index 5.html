<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff8fb">
<title>FRUITS ZIPPER Goods Closet</title>
<style>
:root{--bg:#fff8fb;--text:#3a2e39;--sub:#8c7a89;--pink:#ff6b9d;--border:#f3d9e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding-bottom:28px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.rainbow{height:6px;background:linear-gradient(90deg,#ff595e,#ff924c,#ffca3a,#8ac926,#52b8e8,#7b61a8,#ff6b9d)}
header{background:#fff;text-align:center;padding:18px 14px 15px;border-bottom:2px dashed var(--border)}.eyebrow{font-size:11px;font-weight:900;color:var(--pink);letter-spacing:1px}h1{font-size:22px;margin:4px 0;font-weight:900}.tagline{font-size:12px;color:var(--sub);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}.stat{background:#fff;border:2px solid var(--border);border-radius:15px;text-align:center;padding:10px 4px}.num{font-size:22px;color:var(--pink);font-weight:900}.lbl{font-size:10px;color:var(--sub);font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 10px}.tab{border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--sub);font-size:12px;font-weight:900;padding:11px 3px}.tab.active{background:var(--pink);border-color:var(--pink);color:#fff}.tab.add{background:#ffebf2;color:var(--pink);border-color:var(--pink)}
.filters{padding:0 14px 8px}.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 0 8px}.chip{white-space:nowrap;border:1.5px solid var(--border);background:#fff;color:var(--sub);border-radius:20px;padding:7px 12px;font-size:11px;font-weight:800}.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
main{padding:0 14px}.section-title{font-size:13px;font-weight:900;margin:7px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:2px solid var(--member,#f3d9e5);border-radius:15px;overflow:hidden;min-width:0}.photo{aspect-ratio:1;background:#fdf1f6;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:30px;font-weight:900;color:var(--member,#ff6b9d)}.badge{position:absolute;top:7px;left:7px;border-radius:10px;color:#fff;padding:4px 8px;font-size:10px;font-weight:900}.badge.owned{background:#32b768}.badge.unowned{background:#9670d8}.badge.trade{background:#ff6b9d}.quantity{position:absolute;bottom:7px;right:7px;background:#332b32d9;color:#fff;padding:3px 7px;border-radius:8px;font-size:10px}.cardbody{padding:8px}.meta{display:flex;gap:4px;flex-wrap:wrap}.member,.category{font-size:10px;font-weight:800;border-radius:6px;padding:3px 6px;color:#fff;background:var(--member)}.category{background:#f2eaf0;color:var(--sub)}.name{font-size:12px;font-weight:900;margin:6px 0;overflow-wrap:anywhere}.memo{font-size:10px;color:var(--sub);margin-bottom:6px;overflow-wrap:anywhere}.actions{display:flex;gap:5px;border-top:1px solid #f5eaf0;padding-top:6px}.mini{flex:1;border:0;border-radius:8px;padding:7px 2px;background:#f8f0f4;font-size:10px;font-weight:900;color:var(--text)}.mini.delete{color:#d33}
.panel{background:#fff;border:2px solid var(--pink);border-radius:17px;padding:14px;margin-bottom:12px}.panel-title{text-align:center;color:var(--pink);font-size:15px;font-weight:900;margin-bottom:13px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--sub);font-weight:900;margin-bottom:5px}.input{width:100%;border:2px solid var(--border);border-radius:11px;background:#fff;padding:11px;font-size:14px;color:var(--text)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formbuttons{display:flex;gap:8px;margin-top:14px}.btn{border:0;border-radius:11px;padding:12px;font-size:13px;font-weight:900}.btn.primary{background:var(--pink);color:#fff;flex:2}.btn.secondary{background:#f8eef3;color:var(--sub);flex:1;border:1px solid var(--border)}.btn.gradient{background:linear-gradient(90deg,#ff6b9d,#9670d8);color:#fff;width:100%}
.member-section{background:#fff;border-left:6px solid var(--member);border-radius:14px;padding:12px;margin:0 0 12px}.member-heading{font-weight:900;margin-bottom:9px}.empty{grid-column:1/-1;text-align:center;background:#fff;border-radius:14px;padding:28px 12px;color:var(--sub);font-size:12px;line-height:1.8}
.notice{margin:22px 14px 0;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:14px;color:var(--sub);font-size:11px;line-height:1.7}.notice strong{color:var(--text);display:block;margin-bottom:5px}.backup{display:flex;gap:8px;margin-top:10px}.backup button,.upload-label{flex:1;text-align:center;border:1.5px solid var(--pink);border-radius:10px;background:#fff;color:var(--pink);padding:10px 4px;font-size:11px;font-weight:900}.copyright{text-align:center;color:var(--pink);font-weight:900;margin-top:14px}
.search{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;background:#fff;margin:0 0 8px;font-size:13px}
.hidden{display:none!important}
@media(min-width:600px){main,.filters,.stats,.tabs{max-width:720px;margin-left:auto;margin-right:auto}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.notice{max-width:692px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<div class="rainbow"></div>
<header><div class="eyebrow">FRUITS ZIPPER COLLECTION</div><h1>Goods Closet</h1><div class="tagline">わたしだけの推し活グッズ図鑑</div></header>
<div class="stats">
 <div class="stat"><div class="num" id="statItems">0</div><div class="lbl">登録グッズ</div></div>
 <div class="stat"><div class="num" id="statOwned">0</div><div class="lbl">所持数</div></div>
 <div class="stat"><div class="num" id="statTrade">0</div><div class="lbl">交換に出せる</div></div>
</div>
<nav class="tabs">
 <button class="tab active" data-view="all">グッズ一覧</button><button class="tab add" data-view="form">＋ 登録</button><button class="tab" data-view="members">メンバー別</button><button class="tab" data-view="trades">交換リスト</button>
</nav>
<div class="filters" id="filters">
 <div class="chips" id="statusFilters">
  <button class="chip active" data-status="all">すべて</button><button class="chip" data-status="owned">所持</button><button class="chip" data-status="unowned">未所持（求）</button><button class="chip" data-status="trade">交換可（譲）</button>
 </div>
 <div class="chips" id="categoryFilters">
  <button class="chip active" data-category="all">全種別</button><button class="chip" data-category="生写真">生写真</button><button class="chip" data-category="アクスタ">アクスタ</button><button class="chip" data-category="缶バッジ">缶バッジ</button><button class="chip" data-category="トレカ">トレカ</button><button class="chip" data-category="その他">その他</button>
 </div>
</div>
<main>
 <section id="view-all"><input class="search" id="search" placeholder="グッズ名・メンバー・メモで検索"><div class="section-title">コレクション <span id="resultCount">0</span>件</div><div class="grid" id="itemsGrid"></div></section>
 <section id="view-form" class="hidden">
  <div class="panel"><div class="panel-title">グッズを登録・編集</div><input type="hidden" id="editId">
   <div class="field"><label for="itemName">グッズ名（必須）</label><input class="input" id="itemName" placeholder="例：生写真 衣装A"></div>
   <div class="two"><div class="field"><label for="member">メンバー</label><select class="input" id="member"><option>月足天音</option><option>鎮西寿々歌</option><option>櫻井優衣</option><option>仲川瑠夏</option><option>真中まな</option><option>松本かれん</option><option>早瀬ノエル</option><option>全員・集合</option></select></div>
   <div class="field"><label for="category">種別</label><select class="input" id="category"><option>生写真</option><option>アクスタ</option><option>缶バッジ</option><option>トレカ</option><option>その他</option></select></div></div>
   <div class="two"><div class="field"><label for="status">ステータス</label><select class="input" id="status"><option value="owned">所持</option><option value="trade">交換可（譲）</option><option value="unowned">未所持（求）</option></select></div>
   <div class="field"><label for="quantity">所持数</label><input class="input" id="quantity" type="number" min="0" value="1"></div></div>
   <div class="field"><label for="photo">写真（写真アプリから選択できます）</label><input class="input" id="photo" type="file" accept="image/*"></div>
   <div class="field"><label for="memo">メモ</label><input class="input" id="memo" placeholder="例：ヨリ、サイン入り"></div>
   <div class="formbuttons"><button class="btn secondary" id="cancelForm">戻る</button><button class="btn primary" id="saveItem">保存する</button></div>
  </div>
 </section>
 <section id="view-members" class="hidden"></section>
 <section id="view-trades" class="hidden"><div class="panel"><div class="panel-title">交換一覧画像メーカー（譲・求スタンプ付き）</div><button class="btn gradient" id="makeImage">交換一覧画像を作成する</button><div id="imageOutput" class="hidden" style="margin-top:12px;text-align:center"><p style="font-size:11px;color:var(--pink);font-weight:800">画像を長押しして写真に保存してね！</p><img id="tradeImage" alt="交換リスト画像" style="width:100%;margin-top:8px;border-radius:10px"></div></div><div class="section-title">交換に出せるグッズ一覧</div><div class="grid" id="tradeGrid"></div></section>
</main>
<div class="notice"><strong>データについて</strong>登録データと写真は、このiPhoneのブラウザ内に保存されます。Safariの履歴やWebサイトデータを消すと消える場合があるため、定期的にバックアップを書き出してください。
 <div class="backup"><button id="exportBackup">バックアップ書き出し</button><label class="upload-label">バックアップ読み込み<input id="importBackup" type="file" accept=".json,application/json" hidden></label></div>
 <div class="copyright">Made with love for FRUITS ZIPPER</div>
</div>
<script>
(function(){
'use strict';
const members=['月足天音','鎮西寿々歌','櫻井優衣','仲川瑠夏','真中まな','松本かれん','早瀬ノエル','全員・集合'];
const colors={'月足天音':'#e63946','鎮西寿々歌':'#f77f00','櫻井優衣':'#2ec4b6','仲川瑠夏':'#9b5de5','真中まな':'#00bbf9','松本かれん':'#ff70a6','早瀬ノエル':'#f9c74f','全員・集合':'#ff6b9d'};
const KEY='fz_goods_closet_v5';
let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[];}catch(e){items=[];}
let statusFilter='all',categoryFilter='all',photoData='',currentView='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){alert('保存容量がいっぱいです。写真のサイズを小さくするか、バックアップ後に整理してください。');}}
function stateLabel(s){return s==='owned'?'所持':s==='trade'?'譲':'求';}
function card(item){const color=colors[item.member]||'#ff6b9d';return `<article class="card" style="--member:${color}"><div class="photo">${item.photo?`<img src="${item.photo}" alt="">`:`<span class="placeholder">FZ</span>`}<span class="badge ${item.status}">${stateLabel(item.status)}</span><span class="quantity">×${esc(item.quantity)}</span></div><div class="cardbody"><div class="meta"><span class="member">${esc(item.member)}</span><span class="category">${esc(item.category)}</span></div><div class="name">${esc(item.name)}</div>${item.memo?`<div class="memo">${esc(item.memo)}</div>`:''}<div class="actions"><button class="mini" data-edit="${esc(item.id)}">編集</button><button class="mini delete" data-delete="${esc(item.id)}">削除</button></div></div></article>`;}
function empty(message){return `<div class="empty">${message}</div>`;}
function render(){
 $('statItems').textContent=items.length;
 $('statOwned').textContent=items.filter(x=>x.status==='owned'||x.status==='trade').reduce((n,x)=>n+(Number(x.quantity)||0),0);
 $('statTrade').textContent=items.filter(x=>x.status==='trade').reduce((n,x)=>n+(Number(x.quantity)||0),0);
 const query=$('search').value.trim().toLowerCase();
 const filtered=items.filter(x=>(statusFilter==='all'||x.status===statusFilter)&&(categoryFilter==='all'||x.category===categoryFilter)&&(!query||[x.name,x.member,x.memo,x.category].join(' ').toLowerCase().includes(query)));
 $('resultCount').textContent=filtered.length;
 $('itemsGrid').innerHTML=filtered.length?filtered.map(card).join(''):empty('まだ登録がありません。<br>「＋ 登録」からグッズを追加してね！');
 $('view-members').innerHTML=members.map(m=>{const list=items.filter(x=>x.member===m);return `<div class="member-section" style="--member:${colors[m]}"><div class="member-heading">${m}（${list.length}件）</div><div class="grid">${list.length?list.map(card).join(''):empty('まだ登録がありません')}</div></div>`;}).join('');
 const tradeItems=items.filter(x=>x.status==='trade');
 $('tradeGrid').innerHTML=tradeItems.length?tradeItems.map(card).join(''):empty('「交換可（譲）」のグッズはまだありません');
}
function switchView(view){currentView=view;['all','form','members','trades'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==view));$('filters').classList.toggle('hidden',view!=='all');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='all')render();}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.view==='form')resetForm();switchView(b.dataset.view);}));
$('cancelForm').addEventListener('click',()=>switchView('all'));
$('statusFilters').addEventListener('click',e=>{const b=e.target.closest('[data-status]');if(!b)return;statusFilter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===b));render();});
$('categoryFilters').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;categoryFilter=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));render();});
$('search').addEventListener('input',render);
function resetForm(){ $('editId').value='';$('itemName').value='';$('member').value=members[0];$('category').value='生写真';$('status').value='owned';$('quantity').value='1';$('memo').value='';$('photo').value='';photoData='';}
$('photo').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',0.78);};img.src=ev.target.result;};reader.readAsDataURL(file);});
$('saveItem').addEventListener('click',()=>{const name=$('itemName').value.trim();if(!name){alert('グッズ名を入力してね！');return;}const id=$('editId').value;const old=items.find(x=>x.id===id);const obj={id:id||String(Date.now())+Math.random().toString(16).slice(2),name,member:$('member').value,category:$('category').value,status:$('status').value,quantity:Math.max(0,Number($('quantity').value)||0),memo:$('memo').value.trim(),photo:photoData||(old?old.photo:'')};if(id){const index=items.findIndex(x=>x.id===id);if(index>=0)items[index]=obj;}else items.unshift(obj);save();render();switchView('all');});
document.body.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit){const item=items.find(x=>x.id===edit.dataset.edit);if(!item)return;$('editId').value=item.id;$('itemName').value=item.name;$('member').value=item.member;$('category').value=item.category;$('status').value=item.status;$('quantity').value=item.quantity;$('memo').value=item.memo||'';$('photo').value='';photoData=item.photo||'';switchView('form');window.scrollTo(0,0);return;}const del=e.target.closest('[data-delete]');if(del){const item=items.find(x=>x.id===del.dataset.delete);if(item&&confirm('「'+item.name+'」を削除する？')){items=items.filter(x=>x.id!==item.id);save();render();}}});
$('exportBackup').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fz-goods-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('importBackup').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw new Error('invalid');if(!confirm('現在の登録データを読み込んだ内容に置き換える？'))return;items=data;save();render();alert('バックアップを読み込みました！');}catch(err){alert('読み込みに失敗しました。バックアップファイルを確認してね。');}e.target.value='';};reader.readAsText(file);});
$('makeImage').addEventListener('click',()=>{const give=items.filter(x=>x.status==='trade'),want=items.filter(x=>x.status==='unowned');if(!give.length&&!want.length){alert('「交換可（譲）」または「未所持（求）」を登録してね！');return;}const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),W=900,pad=30,cols=3,cw=(W-pad*2-24*2)/3,ch=cw+100;const sections=[{title:'譲｜交換に出せるグッズ',list:give,color:'#ff6b9d'},{title:'求｜探しているグッズ',list:want,color:'#9670d8'}].filter(s=>s.list.length);let H=130;sections.forEach(s=>H+=60+Math.ceil(s.list.length/cols)*(ch+18));canvas.width=W;canvas.height=H;ctx.fillStyle='#fff8fb';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff6b9d';ctx.font='bold 34px sans-serif';ctx.fillText('FRUITS ZIPPER グッズ交換リスト',W/2,65);let y=105;sections.forEach(sec=>{ctx.fillStyle=sec.color;ctx.fillRect(pad,y,W-pad*2,44);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 24px sans-serif';ctx.fillText(sec.title,pad+16,y+30);y+=58;sec.list.forEach((it,i)=>{const x=pad+(i%cols)*(cw+12),cy=y+Math.floor(i/cols)*(ch+18),mc=colors[it.member]||'#ff6b9d';ctx.fillStyle='#fff';ctx.fillRect(x,cy,cw,ch);ctx.strokeStyle=mc;ctx.lineWidth=4;ctx.strokeRect(x,cy,cw,ch);ctx.fillStyle='#fdf1f6';ctx.fillRect(x+4,cy+4,cw-8,cw-8);ctx.fillStyle=mc;ctx.textAlign='center';ctx.font='bold 50px sans-serif';ctx.fillText('FZ',x+cw/2,cy+cw/2+16);ctx.fillStyle=sec.color;ctx.beginPath();ctx.arc(x+30,cy+30,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText(sec.title.startsWith('譲')?'譲':'求',x+30,cy+38);ctx.fillStyle=mc;ctx.font='bold 16px sans-serif';ctx.fillText(it.member+' / '+it.category,x+cw/2,cy+cw+27);ctx.fillStyle='#3a2e39';ctx.font='bold 18px sans-serif';ctx.fillText(it.name.slice(0,18),x+cw/2,cy+cw+59);});y+=Math.ceil(sec.list.length/cols)*(ch+18)+5;});$('tradeImage').src=canvas.toDataURL('image/png');$('imageOutput').classList.remove('hidden');});
render();
})();
</script>
</body>
</html>
